<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Howard + Mission Bay</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #1a1a1a; }

  /* ---- Third Street badge markers ---- */
  .badge-marker { background: none; border: none; }
  .badge {
    position: absolute; left: 50%;
    width: 44px; height: 44px; margin-left: -22px;
    border-radius: 50%;
    background: #111; border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  .badge svg { width: 24px; height: 24px; fill: #fff; }
  .stem { position: absolute; left: 50%; width: 2px; margin-left: -1px; height: 12px; background: #fff; }
  .dot  { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; }
  .left .badge, .right .badge { top: 50%; margin-top: -22px; }
  .left .badge  { left: auto; right: calc(50% + 12px); margin-left: 0; }
  .right .badge { left: calc(50% + 12px); margin-left: 0; }
  .left .stem, .right .stem { top: 50%; width: 12px; height: 2px; margin: -1px 0 0 0; }
  .left .stem  { left: auto; right: 50%; }
  .right .stem { left: 50%; }
  .badge-marker:hover .badge { transform: scale(1.08); }

  /* ---- The Howard marker ---- */
  .natoma-marker { background: none; border: none; }
  .natoma {
    width: 64px; height: 47px; border-radius: 4px;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  .natoma svg { width: 54px; height: 40px; }
  .natoma-tail {
    width: 0; height: 0; margin: 0 auto;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-top: 9px solid #fff;
  }
  .natoma-marker:hover .natoma { transform: scale(1.06); }

  /* ---- Stops along the way ---- */
  .poi-marker { background: none; border: none; }
  .poi {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    padding: 6px 10px; border-radius: 999px;
    background: #111; border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.55);
    transition: transform .15s ease; white-space: nowrap;
  }
  .poi svg { display: block; width: auto; }
  .poi svg * { fill: #fff; }
  .poi.above { transform: translate(-50%, calc(-100% - 9px)); }
  .poi.below { transform: translate(-50%, 9px); }
  .poi-marker:hover .poi.above { transform: translate(-50%, calc(-100% - 9px)) scale(1.08); }
  .poi-marker:hover .poi.below { transform: translate(-50%, 9px) scale(1.08); }
  .poi-dot { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid #111; box-sizing: border-box; }

  /* ---- Station labels ---- */
  .station-label {
    background: transparent; border: none; box-shadow: none; padding: 0 4px;
    color: #e6e6e6; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
  }
  .station-label::before { display: none; }

  /* ---- Popups ---- */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #111; color: #fff; border-radius: 4px;
    box-shadow: 0 3px 14px rgba(0,0,0,.6);
  }
  .leaflet-popup-content { margin: 12px 16px; font: 14px/1.4 Helvetica, Arial, sans-serif; }
  .leaflet-popup-content strong { display: block; font-size: 15px; margin-bottom: 2px; }
  .leaflet-popup-content .sub { color: #aaa; font-size: 13px; }
  .leaflet-container a.leaflet-popup-close-button { color: #aaa; }
  .leaflet-control-attribution { background: rgba(0,0,0,.55) !important; color: #888; }
  .osm-dark { filter: grayscale(1) invert(1) brightness(.85) contrast(.9); }
  .leaflet-control-attribution a { color: #aaa; }

  /* ---- Commute panel ---- */
  #panel {
    position: absolute; left: 24px; bottom: 24px; z-index: 1000;
    width: clamp(340px, 36vw, 460px); color: #fff;
    background: rgba(17,17,17,.94); border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,.55); overflow: hidden;
  }
  .tabs { display: flex; border-bottom: 1px solid #333; }
  .tab {
    flex: 1; padding: 16px 12px; background: none; border: none; cursor: pointer;
    color: #8a8a8a; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.3;
    transition: color .15s;
  }
  .tab:hover { color: #ccc; }
  .tab.active { color: #fff; box-shadow: inset 0 -3px 0 #fff; }
  .pbody { padding: 22px 26px 26px; }
  .total { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .total .num { font-size: 60px; font-weight: 700; line-height: 1; }
  .total .lbl { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: .07em; }
  .steps { list-style: none; margin: 0 0 22px; padding: 0; }
  .steps li {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 8px; margin: 0 -8px; border-radius: 4px; gap: 14px;
    font-size: 16px; line-height: 1.4; color: #ddd; transition: background .15s;
  }
  .steps li:hover { background: rgba(255,255,255,.06); color: #fff; }
  .sw { flex: 0 0 32px; height: 0; }
  .sw.walk { border-top: 3px dotted #fff; }
  .sw.ride { border-top: 5px solid #bdbdbd; border-radius: 3px; }
  .stops-h { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: #222; border: 1px solid #3a3a3a; color: #fff; border-radius: 999px;
    padding: 8px 14px; font-family: inherit; font-size: 14px; cursor: pointer;
    transition: border-color .15s;
  }
  .chip:hover, .chip:focus-visible { border-color: #fff; outline: none; }

  @media (max-width: 640px) {
    #panel { left: 8px; right: 8px; bottom: 26px; width: auto; }
    .tab { padding: 11px 8px; font-size: 12px; }
    .pbody { padding: 10px 12px 12px; }
    .total { gap: 8px; margin-bottom: 10px; }
    .total .num { font-size: 28px; }
    .total .lbl { font-size: 11px; }
    .steps { margin-bottom: 10px; }
    .steps li { font-size: 13px; padding: 5px 6px; margin: 0 -6px; gap: 10px; }
    .sw { flex-basis: 24px; }
    .stops-h { font-size: 11px; margin-bottom: 8px; }
    .chip { padding: 5px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div class="tabs" role="tablist">
    <button class="tab active" role="tab" data-dir="h2m">The Howard &rarr; Mission Bay</button>
    <button class="tab" role="tab" data-dir="m2h">Mission Bay &rarr; The Howard</button>
  </div>
  <div class="pbody">
    <div class="total"><span class="num" id="total"></span><span class="lbl">minutes<br>door to door</span></div>
    <ul class="steps" id="steps"></ul>
    <div class="stops-h">Stop along the way</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<script>
  var knotLogo = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.68 1.75 16.65 16.5"><path d="M11.248 18.25q-.825 0-1.568-.314a4.3 4.3 0 0 1-1.32-.874 4 4 0 0 1-1.304.214 4 4 0 0 1-2.046-.544 4.27 4.27 0 0 1-1.518-1.485 4 4 0 0 1-.56-2.095q0-.48.131-1.04A4.4 4.4 0 0 1 2.04 10.71a4.07 4.07 0 0 1 .017-3.4 4.2 4.2 0 0 1 1.056-1.418 3.8 3.8 0 0 1 1.6-.842 3.9 3.9 0 0 1 .76-1.683q.593-.759 1.451-1.188a4.04 4.04 0 0 1 1.832-.429q.825 0 1.567.313.742.314 1.32.875a4 4 0 0 1 1.304-.215q1.106 0 2.046.545a4.14 4.14 0 0 1 1.501 1.485q.578.941.578 2.095 0 .48-.132 1.04.66.61 1.023 1.419.363.792.363 1.666 0 .892-.38 1.717a4.3 4.3 0 0 1-1.072 1.435 3.8 3.8 0 0 1-1.584.825 3.8 3.8 0 0 1-.775 1.683 4.06 4.06 0 0 1-1.436 1.188 4.04 4.04 0 0 1-1.832.429m-4.076-2.062q.825 0 1.435-.347l3.103-1.782a.36.36 0 0 0 .164-.313v-1.42L7.881 14.62a.67.67 0 0 1-.726 0l-3.118-1.798a.5.5 0 0 1-.017.115v.198q0 .841.396 1.551.413.693 1.139 1.089a3.2 3.2 0 0 0 1.617.412m.165-2.69a.4.4 0 0 0 .181.05q.083 0 .165-.05l1.238-.71-3.977-2.31a.7.7 0 0 1-.363-.643v-3.58q-.825.362-1.32 1.122a2.9 2.9 0 0 0-.495 1.65q0 .809.413 1.55.412.743 1.072 1.123zm3.91 3.663q.875 0 1.585-.396a2.96 2.96 0 0 0 1.534-2.64v-3.564a.32.32 0 0 0-.165-.297l-1.254-.726v4.604a.7.7 0 0 1-.363.643l-3.119 1.799a3 3 0 0 0 1.783.577m.627-6.039V8.878L10.01 7.822 8.129 8.878v2.244l1.881 1.056zM7.057 5.859a.7.7 0 0 1 .363-.644l3.119-1.798a3 3 0 0 0-1.782-.578q-.874 0-1.584.396A2.96 2.96 0 0 0 6.05 4.324a3.07 3.07 0 0 0-.396 1.551v3.547q0 .199.165.314l1.237.726zm8.383 7.887q.825-.364 1.303-1.123.495-.758.495-1.65a3.15 3.15 0 0 0-.412-1.55q-.413-.743-1.073-1.123l-3.086-1.782q-.099-.065-.181-.049a.3.3 0 0 0-.165.05l-1.238.692 3.993 2.327a.6.6 0 0 1 .264.264.64.64 0 0 1 .1.363zm-3.317-8.382a.63.63 0 0 1 .726 0l3.135 1.831v-.297q0-.792-.396-1.501a2.86 2.86 0 0 0-1.105-1.155q-.71-.43-1.65-.43-.825 0-1.436.347L8.294 5.941a.36.36 0 0 0-.165.314v1.418z"/></svg>';
  var natomaLogo = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 150"><path d="M186,132H18V18h168v114ZM24,126h156V24H24v102Z" fill="#1a1a1a"/><path d="M204,150H0V0h204v150ZM6,144h192V6H6v138Z" fill="#1a1a1a"/><path d="M79.53,101.25v-52.49h-15.67v52.49c0,5.37-1.86,6.25-8.66,7.12v2.63h32.99v-2.63c-6.79-.88-8.66-1.75-8.66-7.12ZM148.14,39v28.05h-24.66v13.59h24.66v30.36h16.66V39h-16.66ZM118,39v72h-16.66v-52.16c0-8.66-5.15-15.12-19.29-15.12h-20.6c-6.36,0-12.82.77-16.22,8.88l-3.07,7.34h-2.96v-20.93h78.79Z" fill="#1a1a1a"/></svg>';

  var ACCENT = '#bdbdbd';  // ride line (grey)
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var map = L.map('map', { zoomControl: true, scrollWheelZoom: false, zoomSnap: 0.25, zoomDelta: 0.5 });
  map.createPane('stations'); map.getPane('stations').style.zIndex = 450;
  map.createPane('traveler'); map.getPane('traveler').style.zIndex = 460;

  // Base map: OpenFreeMap (free, no API key), the same setup as the Amenity Map Maker.
  // Style options: 'dark' (current), 'positron' (light grey), 'liberty', 'bright'.
  var OFM_STYLE = 'dark';
  function hasWebGL() {
    try { var c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
    catch (e) { return false; }
  }
  // Phones and tablets get lightweight image tiles instead of the WebGL (MapLibre) map:
  // WebGL inside an iframe inside Ceros uses enough memory that iPhone Safari can crash the page.
  var isTouchDevice = window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(max-width: 820px)').matches;
  if (!isTouchDevice && L.maplibreGL && hasWebGL()) {
    L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/' + OFM_STYLE }).addTo(map);
    // Added directly: this plugin version doesn't pass its credit line to Leaflet
    map.attributionControl.addAttribution('<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>');
  } else {
    // Phones/tablets (and browsers without WebGL): Esri Dark Gray Canvas image tiles, no key.
    // If Esri refuses tiles, switch to OpenStreetMap tiles darkened with a CSS filter.
    var ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
    var esriAttr = 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors';
    var esriBase = L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: esriAttr, maxNativeZoom: 16, maxZoom: 19 }).addTo(map);
    var esriLabels = L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16, maxZoom: 19 }).addTo(map);
    var tileErrors = 0, switched = false;
    esriBase.on('tileerror', function () {
      if (switched || ++tileErrors < 4) return;
      switched = true;
      map.removeLayer(esriBase); map.removeLayer(esriLabels);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        className: 'osm-dark', maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
      }).addTo(map);
    });
  }

  // Scroll-zoom only after a click, so the map doesn't hijack page scrolling in Ceros
  map.on('click', function () { map.scrollWheelZoom.enable(); });
  map.getContainer().addEventListener('mouseleave', function () { map.scrollWheelZoom.disable(); });

  /* ================= Properties ================= */
  var places = [
    { name: '1455 Third Street', addr: 'San Francisco, CA 94158', lat: 37.77019982786118, lng: -122.38920744353938, type: 'knot', dir: 'left' },
    { name: '1515 Third Street', addr: 'San Francisco, CA 94158', lat: 37.77019227021895, lng: -122.38857875520782, type: 'knot', dir: 'right' },
    { name: 'The Howard', addr: '415 Natoma Street, San Francisco, CA 94103', lat: 37.78155640623101, lng: -122.40578608615195, type: 'natoma' }
  ];
  places.forEach(function (p) {
    var icon = p.type === 'knot'
      ? L.divIcon({
          className: 'badge-marker ' + p.dir,
          html: '<div class="dot"></div><div class="stem"></div><div class="badge">' + knotLogo + '</div>',
          iconSize: [2, 2], iconAnchor: [1, 1],
          popupAnchor: [p.dir === 'left' ? -34 : 34, -26]
        })
      : L.divIcon({
          className: 'natoma-marker',
          html: '<div class="natoma">' + natomaLogo + '</div><div class="natoma-tail"></div>',
          iconSize: [64, 56], iconAnchor: [32, 56], popupAnchor: [0, -56]
        });
    L.marker([p.lat, p.lng], { icon: icon, title: p.name, zIndexOffset: 1000 })
      .addTo(map)
      .bindPopup('<strong>' + p.name + '</strong><span class="sub">' + p.addr + '</span>');
  });

  /* ================= Route geometry ================= */
  // Walk: The Howard -> east on Natoma -> down 5th St (past Seiyun) -> east on Folsom -> Yerba Buena/Moscone station
  var walkHoward = [
    [37.78155640623101, -122.40578608615195], [37.781919, -122.405327], [37.78083105405632, -122.40395207258824],
    [37.780242, -122.403207], [37.78206, -122.40091]
  ];
  // T Third: 4th St (subway + surface) -> 4th & King -> 4th St Bridge -> Channel St -> 3rd St -> UCSF/Chase Center
  var rideT = [
    [37.78206, -122.40091], [37.77775, -122.39607], [37.77590, -122.39400], [37.77530, -122.39330],
    [37.77340, -122.39120], [37.77385, -122.39040], [37.77370, -122.38972], [37.7729639, -122.3896722],
    [37.76882, -122.38929]
  ];
  // Walk: UCSF/Chase Center station -> the Third Street buildings
  var walkMB = [[37.76882, -122.38929], [37.77019, -122.38925], [37.77019, -122.38889]];

  function rev(a) { return a.slice().reverse(); }

  var DIRS = {
    h2m: {
      total: '23',
      steps: [
        { text: '4-minute walk to the Yerba Buena/Moscone Muni station', seg: 0 },
        { text: '15 minutes to King Street stop', seg: 1 }
      ],
      // minutes per leg drive the animation timing (last leg = remainder of door-to-door)
      segs: [
        { kind: 'walk', min: 4.5, pts: walkHoward },
        { kind: 'ride', min: 15,  pts: rideT },
        { kind: 'walk', min: 3.5, pts: walkMB }
      ]
    },
    m2h: {
      total: '15',
      steps: [
        { text: '2.5-minute walk to Muni', seg: 0 },
        { text: '11 minutes to Yerba Buena/Moscone station', seg: 1 }
      ],
      segs: [
        { kind: 'walk', min: 2.5, pts: rev(walkMB) },
        { kind: 'ride', min: 11,  pts: rev(rideT) },
        { kind: 'walk', min: 1.5, pts: rev(walkHoward) }
      ]
    }
  };

  /* ================= Stations ================= */
  var stations = [
    { name: 'Yerba Buena/Moscone', ll: [37.78206, -122.40091], label: 'right' },
    { name: '4th & Brannan',       ll: [37.77775, -122.39607] },
    { name: '4th & King',          ll: [37.77530, -122.39330], label: 'left' },
    { name: 'Mission Rock',        ll: [37.7729639, -122.3896722] },
    { name: 'UCSF/Chase Center',   ll: [37.76882, -122.38929], label: 'left' }
  ];
  stations.forEach(function (s) {
    var m = L.circleMarker(s.ll, {
      pane: 'stations', radius: 5, color: '#111', weight: 2, fillColor: '#fff', fillOpacity: 1
    }).addTo(map);
    m.bindTooltip(s.name + ' station', {
      permanent: !!s.label, direction: s.label || 'top', offset: s.label === 'left' ? [-6, 0] : (s.label ? [6, 0] : [0, -6]),
      className: 'station-label'
    });
  });

    var narrow = map.getSize().x <= 640;
    var opts = narrow
      ? { paddingTopLeft: [56, 64], paddingBottomRight: [56, panel.offsetHeight + 50] }
      : { paddingTopLeft: [panel.offsetWidth + 50, 40], paddingBottomRight: [130, 40] };
    opts.maxZoom = 16;
    opts.animate = !!animateMove;
    map.fitBounds(allPts, opts);
  }

  var tabEls = document.querySelectorAll('.tab');
  for (var i = 0; i < tabEls.length; i++) {
    tabEls[i].addEventListener('click', function () {
      map.closePopup();
      showDirection(this.getAttribute('data-dir'));
      fit(true);
    });
  }

  // Keep panel clicks from reaching the map
  L.DomEvent.disableClickPropagation(panel);
  L.DomEvent.disableScrollPropagation(panel);

  fit(false);
  showDirection('h2m');
  // Only re-frame when the width really changes. Phones fire height-only "resizes" constantly while
  // scrolling (address bar showing/hiding); re-framing on each of those caused a storm of redraws.
  var lastWidth = window.innerWidth, resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      map.invalidateSize({ pan: false });
      if (Math.abs(window.innerWidth - lastWidth) > 40) { lastWidth = window.innerWidth; fit(false); }
    }, 250);
  });
</script>
</body>
</html>
